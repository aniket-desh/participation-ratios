[project]
name = "participation-ratios"
version = "0.1.0"
description = "Predicting covariance spectra and participation ratios of small transformers from generator statistics and learning theory"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=2.0", "scipy>=1.13", "matplotlib>=3.8", "torch>=2.4", "pytest>=8"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prt"]

# Workers are requested with CUDA >= 12.8, which may not run PyPI's CUDA 13 torch,
# so torch comes from PyTorch's cu128 index (same convention as coupled-tensor-networks).
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
